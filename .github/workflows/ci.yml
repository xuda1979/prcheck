name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Test
        run: |
          python -m pytest -q

      - name: CLI smoke (entry point, report, gate)
        run: |
          prcheck --version
          prcheck -d tests/fixtures/example_pr.diff -o "$RUNNER_TEMP/report.md"
          test -s "$RUNNER_TEMP/report.md"
          prcheck -d tests/fixtures/example_pr.diff --exit-code fail-at-high >/dev/null && exit 1 || test $? -eq 1
